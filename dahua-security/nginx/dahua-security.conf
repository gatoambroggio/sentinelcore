# DAWA Security — Nginx reverse proxy
# Serves frontend (HTTP + HTTPS), proxies API, go2rtc streams and snapshots.
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    # Self-signed cert generated by install.sh
    ssl_certificate     /etc/nginx/ssl/dahua-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/dahua-selfsigned.key;

    client_max_body_size 50M;
    root /opt/dahua-enterprise/frontend/dist;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://localhost:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # go2rtc streaming (WebRTC signaling + web UI)
    location /stream/ {
        proxy_pass http://localhost:8083/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # AI detection snapshots
    location /snapshots/ {
        alias /opt/dahua-enterprise/snapshots/;
    }
}